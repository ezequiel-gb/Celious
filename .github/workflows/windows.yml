name: Windows verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install without credentials or shortcuts
        run: python setup.py --tunnel-id tunnel_00000000000000000000000000000000
      - name: Verify locked dependencies
        run: .\service\.venv\Scripts\python.exe -m pip check
      - name: Public package privacy, membership, manifest and checksum
        run: |
          python package.py --check-tracked --check-history 1181f82fd6df5802cf5cc4317dd35ce3f42799b0
          python package.py --verify --check-tracked
          python test_package.py
      - name: Real disposable fresh install and pinned v0.2/v0.3 upgrades
        run: python test_installation.py
      - name: File policy and real stdio MCP protocol
        run: .\service\.venv\Scripts\python.exe service/test_service.py
      - name: Tray lifecycle
        run: .\service\.venv\Scripts\python.exe service/test_tray.py
      - name: Second Brain isolated acceptance
        run: .\service\.venv\Scripts\python.exe service/test_second_brain.py
      - name: Memory MCP and cross-session retrieval
        run: .\service\.venv\Scripts\python.exe service/test_memory_protocol.py
      - name: Project memory, supervised review and migration
        run: .\service\.venv\Scripts\python.exe service/test_project_memory.py
      - name: Hidden Windows process tree shuts down
        run: .\service\.venv\Scripts\python.exe service/tray.py --self-test
      - name: Integrated workflows, ingestion and fresh-session continuity
        run: |
          .\service\.venv\Scripts\python.exe service/test_workflows.py
          .\service\.venv\Scripts\python.exe service/test_workspace_protocol.py
